name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Feature matrix
        run: |
          cargo check -p assetpack-core --no-default-features --features sealed
          cargo check -p assetpack-core --no-default-features --features sqlite
          cargo check -p assetpack-core --no-default-features --features file-transform
          cargo check -p assetpack-core --no-default-features --features sealed-encryption
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
