[package]
authors           = ["DarkSky <darksky2048@gmail.com>"]
description       = "Content-addressed asset packing, chunking, recipe, and SQLite storage primitives."
edition.workspace = true
keywords          = ["asset", "packing", "deduplication", "sqlite", "compression"]
license           = "AGPL-3.0-or-later"
name              = "assetpack-core"
repository        = "https://github.com/darkskygit/assetpack"
version           = "0.1.0"

[dependencies]
brotli       = { workspace = true }
chrono       = { workspace = true }
fastcdc      = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
hex          = { workspace = true }
serde        = { workspace = true, optional = true, features = ["derive"] }
sha3         = { workspace = true }
sqlx         = { workspace = true }
tempfile     = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
zstd         = { workspace = true }

[dev-dependencies]
rand  = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = ["serde"]
serde   = ["dep:serde"]
