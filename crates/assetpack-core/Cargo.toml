[package]
authors           = ["DarkSky <darksky2048@gmail.com>"]
description       = "Content-addressed asset packing, chunking, recipe, and SQLite storage primitives."
edition.workspace = true
keywords          = ["asset", "packing", "deduplication", "sqlite", "compression"]
license           = "AGPL-3.0-or-later"
name              = "assetpack-core"
readme            = "../../README.md"
repository        = "https://github.com/darkskygit/assetpack"
version           = "0.4.0"

[dependencies]
brotli           = { workspace = true }
chacha20poly1305 = { version = "0.11", optional = true }
chrono           = { workspace = true, optional = true }
fastcdc          = { workspace = true }
futures-core     = { workspace = true, optional = true }
futures-util     = { workspace = true, optional = true }
getrandom        = { version = "0.4", optional = true }
hex              = { workspace = true }
hkdf             = { version = "0.13", optional = true }
rusqlite         = { workspace = true, optional = true }
serde            = { workspace = true, optional = true, features = ["derive"] }
sha2             = { version = "0.11", optional = true }
sha3             = { workspace = true }
sqlx             = { workspace = true, optional = true }
tempfile         = { workspace = true, optional = true }
thiserror        = { workspace = true }
tokio            = { workspace = true, optional = true }
zeroize          = { version = "1.8", optional = true }
zstd             = { workspace = true }

[dev-dependencies]
rand  = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = ["serde", "sqlite-pack", "rusqlite-store", "file-transform"]
file-transform = ["dep:serde", "dep:tempfile"]
rusqlite-store = ["dep:rusqlite"]
sealed = []
sealed-encryption = [
  "sealed",
  "dep:chacha20poly1305",
  "dep:getrandom",
  "dep:hkdf",
  "dep:sha2",
  "dep:zeroize",
]
serde = ["dep:serde"]
sqlite-pack = ["dep:rusqlite"]
sqlx-store = [
  "dep:chrono",
  "dep:futures-core",
  "dep:futures-util",
  "dep:sqlx",
  "dep:tokio",
]
