[package]
authors           = ["DarkSky <darksky2048@gmail.com>"]
description       = "Precomp2 file transforms for assetpack, with optional zstd and lzma wrapping."
edition.workspace = true
keywords          = ["asset", "precomp", "compression", "zstd", "lzma"]
license           = "AGPL-3.0-or-later"
name              = "assetpack-transform-precomp2"
readme            = "../../README.md"
repository        = "https://github.com/darkskygit/assetpack"
version           = "0.3.0"

[dependencies]
assetpack-core = { workspace = true, features = ["file-transform"] }
lzma-rust2     = { workspace = true }
precomp2       = { workspace = true }
zstd           = { workspace = true }

[dev-dependencies]
assetpack-core = { workspace = true, features = ["sealed-encryption", "sqlx-store"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
